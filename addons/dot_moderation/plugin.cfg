[plugin]

name="dot-moderation"
description="Bans, kicks, chat gags and voice mutes as one durable record. Pluggable storage so a community running several servers shares one list, expiry checked on read, immunity between staff, and a moderation history per player. Publishes a mute source dot-voice and dot-server both consult."
